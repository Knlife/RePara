# Example for 8 GPUs: 8 * batch_size_per_device(1) * grad_accumulation(8) = 64 prompts.
train:
  model_path: models/SDAR-8B-Chat
  model_family: sdar
  sdar_native_block_size: 4
  mask_id: null
  batch_size_per_device: 1
  grad_accumulation: 8
  total_steps: 128
  learning_rate: 5.0e-06
  weight_decay: 0.0
  max_grad_norm: 1.0
  seed: 1234
  num_generations: 16
  repeat_times: 1
  gen_steps: 256
  gen_length: 256
  method: fixed_mtp
  mtp_block_size: 2
  mtp_confidence: normalized_entropy
  mtp_threshold: 0.8
  selective_logits: true
  activation_checkpointing_strategy: none
  output_dir: outputs/repara-sdar-code-fix2
  log_every: 1
  save_every: 16
  resume_ckpt: null
  dataset: code
  save_model_only: false
  keep_latest_state_only: false
  gsm8k_data_path: null
  math_data_path: null
  code_data_path: datasets/code/train.jsonl
  wandb: false
  wandb_project: RePara
  wandb_run_name: repara-sdar-code-fix2
  wandb_group: sdar-code
  wandb_mode: offline
  wandb_dir: null
  profile_timing: true
  timing_warmup_steps: 1
  eval_every: 0
  format_reward_alpha: 1.0
